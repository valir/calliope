[package]
name = "calliope-gui"
version = "0.1.0"
edition = "2021"
license.workspace = true

[lib]
name = "calliope_gui"
path = "src/lib.rs"

[[bin]]
name = "calliope-gui"
path = "src/main.rs"

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-window-state = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
uuid = { version = "1", features = ["v7"] }
tauri-plugin-dialog = "2"
url = "2"
claxon = "0.4"
flacenc = { version = "0.5", default-features = false }
cpal = "0.18"
signalsmith-stretch = "=0.1.3"
calliope-lib = { path = "../calliope-lib", features = ["client"] }

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dev-dependencies]
tempfile = "3"

[features]
# Test-only scripted file dialogs. Must never be a default feature or in a release build
# (build.rs enforces the latter).
e2e-hooks = []
