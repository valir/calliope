[package]
name = "calliope-gui"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "calliope-gui"
path = "src/main.rs"

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-window-state = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dev-dependencies]
tempfile = "3"
