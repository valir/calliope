[workspace]
# All crates live in src/<crate>/. Plain `cargo build` (and `npm run build:app` in
# src/calliope-gui) builds only the GUI (default-members); the suites use --workspace.
#   calliope-gui    desktop app (Rust + Tauri, Svelte frontend in src/calliope-gui/src/ui)
#   calliope-lib    shared library: stems API types, FLAC parser, process runner, HTTP client
#   calliope-stems  edge-AI stem extraction server (runs on archserver)
members = ["src/calliope-gui", "src/calliope-lib", "src/calliope-stems"]
default-members = ["src/calliope-gui"]
resolver = "2"
