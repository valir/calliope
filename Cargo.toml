[package]
name = "calliope-gui"
version = "0.1.0"
edition = "2021"

[workspace]
# The root package is the GUI. Other crates live in src/<crate>/; plain `cargo build` and
# `npm run build:app` build only the GUI (default-members), the suites use --workspace.
members = ["src/calliope-common", "src/calliope-stems"]
default-members = ["."]

[[bin]]
name = "calliope-gui"
path = "src/main.rs"

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-window-state = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v7"] }
tauri-plugin-dialog = "2"
url = "2"
calliope-common = { path = "src/calliope-common" }

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dev-dependencies]
tempfile = "3"

[features]
# Test-only scripted file dialogs. Must never be a default feature or in a release build
# (build.rs enforces the latter).
e2e-hooks = []
